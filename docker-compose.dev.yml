# Local Postgres for development:  npm run db:up
# Then in apps/web/.env.local:
#   DATABASE_URL=postgres://mushk:mushk@localhost:5432/mushk
name: mushk-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mushk
      POSTGRES_USER: mushk
      POSTGRES_PASSWORD: mushk
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5432}:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mushk -d mushk"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata_dev:
