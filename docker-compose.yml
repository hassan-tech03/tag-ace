# Production stack for the Contabo server.
#   ./deploy/scripts/deploy.sh      (or: docker compose up -d --build)
# All settings come from ./.env (copy .env.example).
name: mushk

x-database-url: &database-url postgres://${POSTGRES_USER:-mushk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mushk}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mushk}
      POSTGRES_USER: ${POSTGRES_USER:-mushk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Asia/Karachi}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
    # Bound to localhost only: reach it from your PC through an SSH tunnel.
    # Never expose 5432 to the internet.
    ports:
      - "127.0.0.1:5432:5432"
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: applies pending migrations, then exits. `web` waits for it.
  # Also used to run the seed scripts (see DEPLOY.md).
  migrate:
    build:
      context: .
      target: tools
    image: mushk-tools:latest
    restart: "no"
    environment:
      DATABASE_URL: *database-url
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_DOMAIN: https://${DOMAIN:?Set DOMAIN in .env}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    image: mushk-web:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      NEXTAUTH_URL: https://${DOMAIN}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
      NEXT_PUBLIC_DOMAIN: https://${DOMAIN}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      TZ: ${TZ:-Asia/Karachi}
    volumes:
      - next_cache:/app/apps/web/.next/cache
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # Reverse proxy with automatic Let's Encrypt HTTPS.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  next_cache:
  caddy_data:
  caddy_config:
